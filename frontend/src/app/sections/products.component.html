<section id="produk" class="sec">
  <div class="hex-bg"></div>
  <div class="subtle-splash-bg" style="right: -4%; top: 25%; width: 340px; transform: scaleX(-1);">
    <img src="https://i.imgur.com/SKOAvML.png" alt="" />
  </div>
  <div class="floating-droplet" style="left: 10%; top: 12%; animation-delay: 0.8s;"></div>
  <div class="floating-droplet" style="right: 14%; bottom: 20%; animation-delay: 2.9s;"></div>

  <div class="inner">
    <div class="rv">
      <span class="sec-chip">03</span>
      <span class="sec-kicker">Daftar Produk</span>
      <h2 class="sec-title">Produk &amp; <em>Harga Resmi</em></h2>
      <div class="sec-bar"></div>
    </div>

    <app-skeleton-card *ngIf="status() === 'loading'" [count]="6" variant="product"></app-skeleton-card>
    <p class="section-error" *ngIf="status() === 'error'">Gagal memuat katalog. Silakan segarkan halaman.</p>

    <ng-container *ngIf="status() === 'ready'">
      <div class="product-tabs rv">
        <button
          type="button"
          *ngFor="let cat of categories()"
          class="tab-btn"
          [class.active]="activeTab() === cat.id"
          (click)="setTab(cat.id)"
        >
          {{ cat.label }}
        </button>
      </div>

      <div class="product-grid">
        <div class="product-card rv" [attr.data-cat]="product.category" *ngFor="let product of visibleProducts()">
          <div class="product-card-media">
            <img *ngIf="product.image" [src]="product.image" [alt]="product.name" loading="lazy" />
            <div class="product-card-placeholder" *ngIf="!product.image" aria-hidden="true">💧</div>
            <span
              class="p-badge product-card-badge"
              [class.best]="product.badgeVariant === 'best'"
              [class.tera]="product.badgeVariant === 'tera'"
            >
              {{ product.badge }}
            </span>
          </div>

          <div class="product-card-body">
            <h3>{{ product.name }}</h3>
            <p class="p-vol">{{ product.volumeLabel }}</p>
            <div class="p-price">
              {{ product.priceLabel }} <span class="p-unit">{{ product.unit }}</span>
            </div>
            <p class="p-desc">{{ product.description }}</p>
          </div>

          <div class="product-card-actions">
            <button type="button" class="card-add-btn" (click)="handleAddToCart(product)">
              {{ i18n.t('cart.addToCart') }}
            </button>
            <a
              [href]="product.orderLink"
              class="card-wa-btn"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'Pesan ' + product.name + ' langsung via WhatsApp'"
            >
              WA →
            </a>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</section>
