<section id="kenapa" class="sec">
  <div class="hex-bg"></div>
  <div class="subtle-splash-bg" style="left: -6%; top: 18%; width: 320px;">
    <img src="https://i.imgur.com/SKOAvML.png" alt="" />
  </div>
  <div class="floating-droplet" style="right: 15%; top: 20%; animation-delay: 1.8s;"></div>
  <div class="floating-droplet" style="left: 20%; bottom: 15%; width: 16px; height: 20px; animation-delay: 4.2s;"></div>

  <div class="inner">
    <div class="rv">
      <span class="sec-chip">02</span>
      <span class="sec-kicker">Kenapa Oxyra</span>
      <h2 class="sec-title">Dibuat untuk <em>hidup yang bergerak.</em></h2>
      <div class="sec-bar"></div>
    </div>

    <app-skeleton-card *ngIf="status() === 'loading'" [count]="4" variant="product"></app-skeleton-card>
    <p class="section-error" *ngIf="status() === 'error'">Gagal memuat konten. Silakan segarkan halaman.</p>

    <div class="why-grid" *ngIf="status() === 'ready'">
      <div class="why-card rv" *ngFor="let reason of reasons()">
        <app-icon [name]="reason.icon"></app-icon>
        <h3>{{ reason.title }}</h3>
        <p>{{ reason.description }}</p>
      </div>
    </div>
  </div>
</section>
