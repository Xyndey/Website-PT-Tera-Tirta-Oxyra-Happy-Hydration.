<section id="relief" #reliefSection class="sec snap-sec" [class.crystallized]="crystallized">
  <canvas id="wonder-canvas" #wonderCanvas></canvas>

  <div class="wonder-badge" id="wonder-badge">
    ❄️ Tetesan air menyelaraskan diri menjadi kristal OXYRA
  </div>

  <div class="floating-bubbles" id="interactive-bubbles">
    <div class="bubble" style="width: 32px; height: 32px; left: 16%; animation-delay: 0s; animation-duration: 7s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 30%; animation-delay: 2s; animation-duration: 9s;"></div>
    <div class="bubble" style="width: 44px; height: 44px; left: 68%; animation-delay: 1s; animation-duration: 8s;"></div>
    <div class="bubble" style="width: 24px; height: 24px; left: 84%; animation-delay: 3s; animation-duration: 6s;"></div>
  </div>

  <div class="decor splash-r" aria-hidden="true">
    <img src="https://i.imgur.com/SKOAvML.png" alt="Oxyra Vertical Water Splash" />
  </div>

  <img
    id="flakeimg"
    #flakeImg
    src="/images/store/oxyra-flake.jpg"
    alt="Kristal salju heksagonal OXYRA"
  />

  <div class="brand-name">OXYRA</div>
  <p class="era-line">Welcome to the Happy Hydration Era</p>
  <p class="sub-line">Tetap terhidrasi setiap hari dengan pengalaman minum yang lebih menyenangkan.</p>

  <div class="hydro-pool-wrap" aria-hidden="true">
    <div class="hydro-droplet"></div>
    <div class="pool-ripples">
      <i></i>
      <i></i>
      <i></i>
    </div>
  </div>
</section>
