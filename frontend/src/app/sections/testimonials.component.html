<section id="testimoni" class="sec">
  <div class="subtle-splash-bg" style="left: -5%; bottom: 15%; width: 300px;">
    <img src="https://i.imgur.com/SKOAvML.png" alt="" />
  </div>
  <div class="floating-droplet" style="right: 25%; top: 15%; animation-delay: 2.3s;"></div>

  <div class="inner">
    <div class="rv">
      <span class="sec-chip">05</span>
      <span class="sec-kicker">Testimoni</span>
      <h2 class="sec-title">Kata <em>Mereka</em></h2>
      <div class="sec-bar"></div>
    </div>

    <app-skeleton-card *ngIf="status() === 'loading'" [count]="3" variant="product"></app-skeleton-card>
    <p class="section-error" *ngIf="status() === 'error'">Gagal memuat testimoni. Silakan segarkan halaman.</p>

    <div class="testi-grid" *ngIf="status() === 'ready'">
      <div class="testi-card rv" *ngFor="let testimonial of testimonials()">
        <div class="stars">{{ stars(testimonial.rating) }}</div>
        <p class="testi-quote">&ldquo;{{ testimonial.quote }}&rdquo;</p>
        <div class="testi-author">{{ testimonial.author }}</div>
        <div class="testi-loc">{{ testimonial.location }}</div>
      </div>
    </div>
  </div>
</section>
